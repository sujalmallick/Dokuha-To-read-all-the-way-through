name: Build iOS IPA

# Restricted strictly to manual trigger (workflow_dispatch) as requested by user.
# Will not run automatically on push or pull_request.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ipa:
    name: Build iOS IPA (${{ inputs.configuration }})
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('UI UX/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: UI UX

      - name: Build Kotlin Multiplatform iOS Framework
        run: |
          if [ "${{ inputs.configuration }}" = "Debug" ]; then
            ./gradlew :composeApp:linkDebugFrameworkIosArm64 \
              --parallel --build-cache \
              -Dorg.gradle.jvmargs="-Xmx6144M -XX:+UseG1GC -Dfile.encoding=UTF-8" \
              -Dkotlin.daemon.jvmargs="-Xmx4096M -XX:+UseG1GC"
          else
            ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
              --parallel --build-cache \
              -Dorg.gradle.jvmargs="-Xmx6144M -XX:+UseG1GC -Dfile.encoding=UTF-8" \
              -Dkotlin.daemon.jvmargs="-Xmx4096M -XX:+UseG1GC"
          fi
          ./gradlew --stop
        working-directory: UI UX

      - name: Build and Archive iOS App via Xcode
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration ${{ inputs.configuration }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/Dokuha.xcarchive \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Dokuha.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in archive!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/Dokuha.app
          cd build
          zip -qr "Dokuha-${{ inputs.configuration }}.ipa" Payload
          ls -lh "Dokuha-${{ inputs.configuration }}.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dokuha-iOS-${{ inputs.configuration }}-IPA
          path: build/Dokuha-${{ inputs.configuration }}.ipa
          if-no-files-found: error
          retention-days: 14
